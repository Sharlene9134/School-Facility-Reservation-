<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facility Reservation System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
        /* Facility divs Styles */
        .facility-card {
            background-color: #f0f0f0;
            padding: 20px;
            border-radius: 5px;
            margin-top: 10px;
        }

        .facility-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            box-shadow:0 2px 10px rgba(0,0,0,.1);
        }

        th, td{
            padding:15px;
            text-align:left;
        }

        tbody tr:hover{
            background:#f5f5f5;
        }

        tbody tr{
            border-bottom:1px solid #ddd;
        }

        thead{
            background:#1E3A8A;
            color:white;
        }

        table{
            border-radius:5px;
            overflow:hidden;
        }

        button {
            border-radius: 8px;
            padding: 10px;
            color: white;
            background-color: #1E3A8A;
        }
    </style>
</head>

<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="logo">
            <h2>SFRS</h2>
            <p>School Facility Reservation System</p>
        </div>

        <a href="dashboard.html"><i class="bi bi-house"></i>Dashboard</a>
        <a href="facilities.html"><i class="bi bi-building"></i>Facilities</a>
        <a href="reservation.html"><i class="bi bi-calendar"></i>Reservations</a>
        <a href="calendar.html"><i class="bi bi-calendar3"></i>Calendar</a>
        <a href="maintenance.html"><i class="bi bi-wrench"></i>Maintenance</a>
        <a href="notifications.html"><i class="bi bi-bell"></i>Notifications</a>
        <a href="reports.html"><i class="bi bi-bar-chart"></i>Reports</a>

        <div class="menu">
            <a href="#">Profile</a>
            <a href="#">Log Out</a>
        </div>
    </aside>

    <!-- Body -->
    <main>
        <div class="container">
            <h1>Facilities</h1>

            <div class="table-container">
                <div class="facility-card">

                    <button>Add Facilities</button>

                    <table class="facility-table">
                        <thead>
                            <tr>
                                <th>Facility Name</th>
                                <th>Building</th>
                                <th>Floor</th>
                                <th>Capacity</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td> Basketball Court</td>
                                <td>Building A</td>
                                <td>1</td>
                                <td>50</td>
                                <td>Available</td>
                                <td>
                                    <button>Edit</button>
                                    <button>Delete</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
