    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
        .card{
            background-color: #f0f0f0;
            padding: 20px;
            border-radius: 5px;
            margin-top: 10px;
        }
        
        .image{
            background-color: #000;
            border-radius: 50px;
            width: 100px;
            height: 100px;
        }
    </style>
</head>

<body>
    <aside class="sidebar">
        <div class="logo">
            <h2>SFRS</h2>
            <p>School Facility Reservation System</p>
        </div>

        <a href="dashboard.html"><i class="bi bi-house"></i>Dashboard</a>
        <a href="facilities.html"><i class="bi bi-building"></i>Facilities</a>
        <a href="reservation.html"><i class="bi bi-calendar"></i>Reservations</a>
        <a href="calendar.html"><i class="bi bi-calendar3"></i>Calendar</a>
        <a href="maintenance.html"><i class="bi bi-wrench"></i>Maintenance</a>
        <a href="notifications.html"><i class="bi bi-bell"></i>Notifications</a>
        <a href="reports.html"><i class="bi bi-bar-chart"></i>Reports</a>

        <div class="menu">
            <a href="profile.html">Profile</a>
            <a href="#">Log Out</a>
        </div>
    </aside>

    <main>
        <div class="container">
            <h1>Profile</h1>

            <div class="card">
                <!-- Profile picture of the account owner -->
                <div class="profile-card">
                    <div class="image"></div>
                    <h3>Name of the account owner</h3>
                </div>

                <div>
                    <form>
                        <label>Employee ID</label>
                        <input type="number">

                        <label>Name</label>
                        <input type="text">

                        <label>Email</label>
                        <input type="email">

                        <label>Contact</label>
                        <input type="number">

                        <label>Home Address</label>
                        <input type="text">

                        <label>Department</label>
                        <input type="text">

                        <label>Position</label>
                        <input type="text">
                    </form>

                    <div>
                        <button>Edit</button>
                        <button>Save</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
