<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facility Reservation System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <a href="dashboard.html"><i class="bi bi-house"></i>Dashboard</a>
        <a href="facilities.html"><i class="bi bi-building"></i>Facilities</a>
        <a href="reservation.html"><i class="bi bi-calendar"></i>Reservations</a>
        <a href="calendar.html"><i class="bi bi-calendar3"></i>Calendar</a>
        <a href="maintenance.html"><i class="bi bi-wrench"></i>Maintenance</a>
        <a href="notifications.html"><i class="bi bi-bell"></i>Notifications</a>
        <a href="reports.html"><i class="bi bi-bar-chart"></i>Reports</a>
    </aside>

    <!-- Body -->
    <main>
        <div>
            <h1>Reservations</h1>

            <div>
                <h3>Create Reservation</h3>

                <form>
                    <label>Facility:</label>
                    <select>
                        <option value="">Select a facility</option>
                    </select>

                    <label>Date:</label>
                    <input type="date">

                    <label>Start Time:</label>
                    <input type="datetime-local">

                    <label>End Time:</label>
                    <input type="datetime-local">

                    <label>Purpose</label>
                    <input type="text" placeholder="Enter purpose of reservation">

                    <button type="submit">Create Reservation</button>
                </form>
            </div>

            <div>
                <h3>Reservation Approval</h3>

                <div>
                    <p>All</p>
                    <p>Pending</p>
                    <p>Approved</p>
                    <p>Rejected</p>
                    
                    <table>
                        <thead>
                            <tr>
                                <th>Request ID</th>
                                <th>Facility</th>
                                <th>Date</th>
                                <th>Time</th>
                                <th>Requested By</th>
                                <th>Purpose</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                    </table>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
